name: Release

# A published release v<version> gets the skill built and attached: the zip and SHA256SUMS, the same
# bytes Orientim serves at /skill/ for that version, and orientim.mcpb, the MCP server as a Claude
# Desktop extension. The tag must name the skill's own version. The same server goes to npm as
# orientim-mcp through npm's trusted publishing: npm takes this workflow's own OIDC token, for this
# repository and this file only, so there is no npm token to keep or renew, and the package carries
# npm's provenance. Run by hand on a release tag (Use workflow from: the tag), it publishes to npm
# only (a release whose publish failed). It runs on a tag only, so the provenance npm shows names the
# very commit that was built.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tests and the build run with read access only: no step that runs the repository's or a
  # dependency's code can publish, sign or write to the release.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run on a release tag only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::Run this on a release tag v<version> (Use workflow from: the tag), not on $GITHUB_REF."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No cache where a release is built and signed: only the lockfile's hashes decide what is installed.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: The tag is the skill's version
        run: |
          version=$(node -p "require('./skills/orientim-protected-swap/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: npm run build
      - run: cp skills/orientim-protected-swap/SHA256SUMS dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Only this job can sign, attach and publish, and it runs none of the repository's code: it takes
  # the files the build made, as they are.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # A signed statement, from GitHub, that these files were built here from this tag.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # Anyone can check a download with: gh attestation verify orientim-protected-swap.zip -R orientimhq/orientim-protected-swap
      - if: github.event_name == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/orientim-protected-swap.zip
            dist/SHA256SUMS
            dist/orientim.mcpb
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        # Never over files already attached: a release's files, once there, stay what they were.
        run: gh release upload "$GITHUB_REF_NAME" dist/orientim-protected-swap.zip dist/SHA256SUMS dist/orientim.mcpb --repo "$GITHUB_REPOSITORY"
      # Trusted publishing needs npm 11.5.1 or later; Node 24 brings it.
      - name: Publish orientim-mcp to npm
        run: |
          version=$(node -p "require('./dist/orientim-mcp/package.json').version")
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) cannot use trusted publishing (11.5.1 or later)"; exit 1; }
          if [ "$(npm view "orientim-mcp@$version" version 2>/dev/null)" = "$version" ]; then
            echo "orientim-mcp@$version is already on npm: nothing to publish."
            # Still ask npm whether it trusts this workflow, as a publish would: the answer, never the token.
            id=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -p "JSON.parse(require('fs').readFileSync(0)).value")
            answer=$(mktemp)
            code=$(curl -s -o "$answer" -w '%{http_code}' -X POST -H "Authorization: Bearer $id" \
              https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/orientim-mcp)
            if [ "$code" = 201 ] || [ "$code" = 200 ]; then
              rm -f "$answer"
              echo "::notice::npm trusts this workflow to publish orientim-mcp."
            else
              why=$(node -p "try{JSON.parse(require('fs').readFileSync('$answer','utf8')).message}catch{''}")
              rm -f "$answer"
              echo "::error::npm does not trust this workflow to publish orientim-mcp (HTTP $code: $why): check its trusted publisher."
              exit 1
            fi
          else
            npm publish ./dist/orientim-mcp --provenance --access public --ignore-scripts
          fi
