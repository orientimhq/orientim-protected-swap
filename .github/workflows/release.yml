name: Release

# A tag v<version> builds the skill and publishes it as a release: the zip and SHA256SUMS, the same
# bytes Orientim serves at /skill/ for that version. The tag must name the skill's own version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: The tag is the skill's version
        run: |
          version=$(node -p "require('./skills/orientim-protected-swap/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: npm run build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp skills/orientim-protected-swap/SHA256SUMS dist/SHA256SUMS
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/orientim-protected-swap.zip dist/SHA256SUMS \
            --title "Orientim protected swap skill $GITHUB_REF_NAME" --notes "$notes

          Check your copy: \`sha256sum -c SHA256SUMS\` in the unzipped folder, and compare with https://orientim.com/skill/SHA256SUMS."
