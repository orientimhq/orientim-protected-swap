name: Release

# A published release v<version> gets the skill built and attached: the zip and SHA256SUMS, the same
# bytes Orientim serves at /skill/ for that version, and orientim.mcpb, the MCP server as a Claude
# Desktop extension. The tag must name the skill's own version. With an NPM_TOKEN secret, the same
# server goes to npm as orientim-mcp, with npm's provenance.
on:
  release:
    types: [published]

permissions:
  contents: write
  # A signed statement, from GitHub, that these files were built here from this tag.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: The tag is the skill's version
        run: |
          version=$(node -p "require('./skills/orientim-protected-swap/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - run: npm run build
      - run: cp skills/orientim-protected-swap/SHA256SUMS dist/SHA256SUMS
      # Anyone can check a download with: gh attestation verify orientim-protected-swap.zip -R orientimhq/orientim-protected-swap
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/orientim-protected-swap.zip
            dist/SHA256SUMS
            dist/orientim.mcpb
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Never over files already attached: a release's files, once there, stay what they were.
        run: gh release upload "$GITHUB_REF_NAME" dist/orientim-protected-swap.zip dist/SHA256SUMS dist/orientim.mcpb
      # The npm token reaches only the steps that need it, never the install or the tests.
      - name: Is there an npm token
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: if [ -n "$NPM_TOKEN" ]; then echo publish=yes >> "$GITHUB_OUTPUT"; fi
      - name: Publish orientim-mcp to npm
        if: steps.npm.outputs.publish == 'yes'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/.npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc" npm publish dist/orientim-mcp --provenance --access public
