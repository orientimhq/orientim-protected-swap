name: Release

# A published release v<version> gets the skill built and attached: the zip and SHA256SUMS, the same
# bytes Orientim serves at /skill/ for that version, and orientim.mcpb, the MCP server as a Claude
# Desktop extension. The tag must name the skill's own version. The same server goes to npm as
# orientim-mcp through npm's trusted publishing: npm takes this workflow's own OIDC token, for this
# repository and this file only, so there is no npm token to keep or renew, and the package carries
# npm's provenance. Run by hand with a tag, it publishes to npm only (a release whose publish failed).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'A release tag already out, v<version>: publish its orientim-mcp to npm'
        required: true

permissions:
  contents: write
  # A signed statement, from GitHub, that these files were built here from this tag.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No cache where a release is built and signed: only the lockfile's hashes decide what is installed.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: The tag is the skill's version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./skills/orientim-protected-swap/package.json').version")
          test "$TAG" = "v$version"
      - run: npm run build
      - run: cp skills/orientim-protected-swap/SHA256SUMS dist/SHA256SUMS
      # Anyone can check a download with: gh attestation verify orientim-protected-swap.zip -R orientimhq/orientim-protected-swap
      - if: github.event_name == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/orientim-protected-swap.zip
            dist/SHA256SUMS
            dist/orientim.mcpb
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        # Never over files already attached: a release's files, once there, stay what they were.
        run: gh release upload "$GITHUB_REF_NAME" dist/orientim-protected-swap.zip dist/SHA256SUMS dist/orientim.mcpb
      # Trusted publishing needs npm 11.5.1 or later; Node 24 brings it.
      - name: Publish orientim-mcp to npm
        run: |
          version=$(node -p "require('./dist/orientim-mcp/package.json').version")
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) cannot use trusted publishing (11.5.1 or later)"; exit 1; }
          if [ "$(npm view "orientim-mcp@$version" version 2>/dev/null)" = "$version" ]; then
            echo "orientim-mcp@$version is already on npm: nothing to publish."
          else
            npm publish ./dist/orientim-mcp --provenance --access public
          fi
