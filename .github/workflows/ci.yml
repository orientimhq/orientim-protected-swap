name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # No package runs code of its own at install.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # The bundles and SHA256SUMS must be exactly what the source builds.
      - run: npm run check
      - name: The shipped files match SHA256SUMS
        working-directory: skills/orientim-protected-swap
        run: sha256sum -c SHA256SUMS
      - name: The skill installs on its own
        run: |
          cp -r skills/orientim-protected-swap "$RUNNER_TEMP/skill"
          cd "$RUNNER_TEMP/skill"
          npm ci --ignore-scripts
          status=0; node bin/orientim-verify.mjs > /dev/null || status=$?
          test "$status" -eq 2
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25"}}' \
            | node bin/orientim-mcp.mjs | grep -q '"protocolVersion":"2025-11-25"'

  windows:
    # The skill runs on Windows too: its policy path, its state directory and the command.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  mcp:
    # The MCP server as npm and Claude Desktop ship it, started as a client starts it, on every Node
    # the package claims and on each system.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20.18.0', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: node tools/mcp/smoke.mjs dist/orientim-mcp/bin/orientim-mcp.mjs

  reproducible:
    # The same source must give the same bytes on another runner image.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: shasum -a 256 dist/orientim-protected-swap.zip skills/orientim-protected-swap/SHA256SUMS dist/orientim.mcpb dist/orientim-mcp/bin/orientim-mcp.mjs
      - name: The MCP server for npm and Claude Desktop needs nothing beside it
        run: |
          cp dist/orientim-mcp/bin/orientim-mcp.mjs "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25"}}' \
            | node orientim-mcp.mjs | grep -q '"protocolVersion":"2025-11-25"'
